<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Cozy Vibe Check 🧸💖</title>
    <style>
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(255, 133, 161, 0.4); }
            50% { box-shadow: 0 0 25px rgba(255, 133, 161, 0.8); }
            100% { box-shadow: 0 0 15px rgba(255, 133, 161, 0.4); }
        }
        @keyframes fadeInSlide {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        body {
            font-family: 'Segoe UI', cursive, sans-serif;
            background: linear-gradient(135deg, #1f1a24, #2d1b36);
            color: #fce4ec;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }
        .card {
            background: rgba(45, 27, 54, 0.9);
            backdrop-filter: blur(12px);
            padding: 35px;
            border-radius: 24px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 182, 193, 0.3);
            animation: float 4s ease-in-out infinite;
        }
        h2 {
            color: #ffb6c1;
            text-align: center;
            margin-top: 0;
            font-size: 26px;
            text-shadow: 0 2px 10px rgba(255, 182, 193, 0.3);
        }
        .subtitle {
            color: #d1c4e9;
            text-align: center;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .step {
            display: none;
        }
        .step.active {
            display: block;
            animation: fadeInSlide 0.4s ease-out forwards;
        }
        label {
            display: block;
            margin-bottom: 15px;
            font-weight: 600;
            color: #ffccd5;
            font-size: 16px;
            text-align: center;
            line-height: 1.4;
        }
        input, select {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            margin-bottom: 20px;
            border-radius: 14px;
            border: 1.5px solid #ffb6c1;
            background: #251631;
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }
        input:focus, select:focus {
            border-color: #ff85a1;
            box-shadow: 0 0 12px rgba(255, 133, 161, 0.4);
            transform: scale(1.01);
        }
        .btn-group {
            display: flex;
            gap: 12px;
        }
        button {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }
        button:active {
            transform: scale(0.96);
        }
        .btn-next, .btn-submit {
            background: linear-gradient(135deg, #ff85a1, #ffb6c1);
            color: #2d1b36;
            animation: pulseGlow 3s infinite;
        }
        .btn-next:hover, .btn-submit:hover {
            background: linear-gradient(135deg, #ff6b8b, #ff85a1);
            transform: translateY(-3px);
        }
        .btn-back {
            background: #3b284a;
            color: #ffb6c1;
            width: 40%;
            border: 1px solid rgba(255, 182, 193, 0.2);
        }
        .btn-back:hover {
            background: #4c335e;
            transform: translateY(-2px);
        }
        .error-msg {
            color: #ff8787;
            text-align: center;
            font-size: 13px;
            margin-bottom: 12px;
            display: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🌙✨ Cozy Vibe Check ✨🧸</h2>
        <p class="subtitle">Let's legally expose your true group chat energy... 🕵️‍♀️💖</p>

        <!-- Formspree Endpoint -->
        <form id="quizForm" action="https://formspree.io/f/xppqdvne" method="POST">
            
            <!-- STEP 1: Name -->
            <div class="step active" id="step-1">
                <label>🏷️ What should we call your cute/chaotic self?</label>
                <input type="text" id="friendName" name="Friend_Name" placeholder="Type your cute nickname here... ✍️" autocomplete="off">
                <div class="error-msg" id="err-1">⚠️ Please enter your name first, bestie! 🥺</div>
                <button type="button" class="btn-next" onclick="nextStep(1)">Next Step ➔ 🚀</button>
            </div>

            <!-- STEP 2: Question 1 -->
            <div class="step" id="step-2">
                <label>⏰ 1. It's 3 AM. What are you doing in the group chat?</label>
                <select name="Q1_3AM_Vibe" id="q1">
                    <option value="" disabled selected>Select your midnight vibe... 👇</option>
                    <option value="Chaos Gremlin">🤪 Sending unhinged TikToks with zero context</option>
                    <option value="Cozy NPC">😴 Fast asleep, phone on DND wrapped like a burrito</option>
                    <option value="Overthinker">📈 Typing a 4-paragraph deep text, then deleting it</option>
                    <option value="Main Character">🌧️ Staring out the window pretending I'm in a sad indie movie</option>
                </select>
                <div class="error-msg" id="err-2">⚠️ Pick a vibe before moving forward! ✨</div>
                <div class="btn-group">
                    <button type="button" class="btn-back" onclick="prevStep(2)">← Back</button>
                    <button type="button" class="btn-next" onclick="nextStep(2)">Next ➔ 💫</button>
                </div>
            </div>

            <!-- STEP 3: Question 2 -->
            <div class="step" id="step-3">
                <label>🍪 2. Your midnight snack drawer is audited. What's inside?</label>
                <select name="Q2_Snacks" id="q2">
                    <option value="" disabled selected>Select your snack profile... 👇</option>
                    <option value="Chaos Gremlin">🗑️ Half-eaten random candy from 3 months ago</option>
                    <option value="🧸 Cozy NPC">🧸 Warm tea packets, teddy-bear cookies, and comfort snacks</option>
                    <option value="Overthinker">🥗 Strictly organized organic protein bars with calorie tags</option>
                    <option value="Main Character">🍓 An aesthetic iced matcha latte and single macaron</option>
                </select>
                <div class="error-msg" id="err-3">⚠️ Don't hide your secret snacks, pick one! 👀</div>
                <div class="btn-group">
                    <button type="button" class="btn-back" onclick="prevStep(3)">← Back</button>
                    <button type="button" class="btn-next" onclick="nextStep(3)">Next ➔ 🍰</button>
                </div>
            </div>

            <!-- STEP 4: Question 3 -->
            <div class="step" id="step-4">
                <label>🫠 3. How do you survive a moment of pure social awkwardness?</label>
                <select name="Q3_Awkward" id="q3">
                    <option value="" disabled selected>Select your survival tactic... 👇</option>
                    <option value="Chaos Gremlin">👁️‍🗨️ Make intense eye contact and say something wildly weird</option>
                    <option value="Cozy NPC">📱 Pretend to check my phone for a non-existent emergency</option>
                    <option value="Overthinker">🧠 Analyze my posture, tone, and eye twitch for 4 business days</option>
                    <option value="Main Character">💃 Sigh dramatically, hair flip, and pretend it never happened</option>
                </select>
                <div class="error-msg" id="err-4">⚠️ Almost done, pick your coping mechanism! 🤭</div>
                <div class="btn-group">
                    <button type="button" class="btn-back" onclick="prevStep(4)">← Back</button>
                    <button type="button" class="btn-next" onclick="nextStep(4)">Next ➔ 🔥</button>
                </div>
            </div>

            <!-- STEP 5: Question 4 -->
            <div class="step" id="step-5">
                <label>💖 4. Pick the ultimate emoji that describes your raw soul:</label>
                <select name="Q4_Emoji" id="q4">
                    <option value="" disabled selected>Select your soul emoji... 👇</option>
                    <option value="Chaos Gremlin">💀 (Certified menace to society)</option>
                    <option value="Cozy NPC">🧸 (Needs a blanket burrito immediately)</option>
                    <option value="Overthinker">📊 (Stressed color-coded spreadsheet energy)</option>
                    <option value="Main Character">✨ (Glitter, delusion, and main character aura)</option>
                </select>
                <div class="error-msg" id="err-5">⚠️ Select your soul emoji to finish! 👑</div>
                <div class="btn-group">
                    <button type="button" class="btn-back" onclick="prevStep(5)">← Back</button>
                    <button type="submit" class="btn-submit">Reveal My Vibe! 🎉✨</button>
                </div>
            </div>

        </form>
    </div>

    <script>
        function nextStep(current) {
            if (current === 1) {
                let nameVal = document.getElementById('friendName').value.trim();
                if (!nameVal) {
                    document.getElementById('err-1').style.display = 'block';
                    return;
                }
                document.getElementById('err-1').style.display = 'none';
            } else {
                let selectVal = document.getElementById('q' + (current - 1)).value;
                if (!selectVal) {
                    document.getElementById('err-' + (current)).style.display = 'block';
                    return;
                }
                document.getElementById('err-' + (current)).style.display = 'none';
            }

            document.getElementById('step-' + current).classList.remove('active');
            document.getElementById('step-' + (current + 1)).classList.add('active');
        }

        function prevStep(current) {
            document.getElementById('step-' + current).classList.remove('active');
            document.getElementById('step-' + (current - 1)).classList.add('active');
        }
    </script>
</body>
</html>
